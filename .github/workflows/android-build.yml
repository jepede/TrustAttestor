name: Android CLI Build

on:
  push:
    branches:
      - main
      - cli-build
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRUST_ATTESTOR_BUILD_ROOT: ${{ github.workspace }}-build
      GRADLE_USER_HOME: ${{ github.workspace }}-build/gradle-user

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Android build toolchain
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Validate CLI scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n android/build-cli.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "android/build-cli.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'

      - name: Build and verify Debug APK
        shell: bash
        run: ./android/build-cli.sh debug --skip-sdk-install

      - name: Confirm repository stayed clean of build state
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(find . -type d \( -name build -o -name .gradle -o -name .kotlin -o -name .cxx \) -print)"
          if [ -n "$unexpected" ]; then
            echo "Build state was written inside the repository:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Upload Debug APK and verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trustattestor-debug-${{ github.sha }}
          path: ${{ github.workspace }}-build/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
