name: Set up TrustAttestor Android build
description: Install the exact JDK and Android SDK packages pinned by android/gradle.properties.

inputs:
  cache-read-only:
    description: Restore Gradle caches without writing them back.
    required: false
    default: "true"

outputs:
  build-tools:
    description: Android Build Tools version.
    value: ${{ steps.toolchain.outputs.build_tools }}
  d8-build-tools:
    description: Build Tools version used for the embedded DEX R8/D8 jar.
    value: ${{ steps.toolchain.outputs.d8_build_tools }}
  cmake:
    description: CMake version.
    value: ${{ steps.toolchain.outputs.cmake }}
  compile-sdk:
    description: Android compile SDK.
    value: ${{ steps.toolchain.outputs.compile_sdk }}
  ndk:
    description: Android NDK version.
    value: ${{ steps.toolchain.outputs.ndk }}

runs:
  using: composite
  steps:
    - name: Read pinned toolchain versions
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        from pathlib import Path

        properties = {}
        for raw_line in Path("android/gradle.properties").read_text(encoding="utf-8").splitlines():
            line = raw_line.strip()
            if not line or line.startswith("#") or "=" not in line:
                continue
            key, value = line.split("=", 1)
            properties[key.strip()] = value.strip()

        mapping = {
            "java_version": "trustAttestor.java.version",
            "compile_sdk": "trustAttestor.android.compileSdk",
            "build_tools": "trustAttestor.android.buildTools",
            "d8_build_tools": "trustAttestor.android.d8BuildTools",
            "ndk": "trustAttestor.android.ndk",
            "cmake": "trustAttestor.android.cmake",
        }
        for output_name, property_name in mapping.items():
            value = properties.get(property_name)
            if not value:
                raise SystemExit(f"Missing required Gradle property: {property_name}")
            print(f"{output_name}={value}")
        PY

    - name: Make CLI and Gradle wrapper executable
      shell: bash
      run: chmod +x android/gradlew android/build-cli.sh

    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: temurin
        java-version: ${{ steps.toolchain.outputs.java_version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Size Gradle and Kotlin daemons for runner
      shell: bash
      run: |
        set -euo pipefail
        gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_user_home"
        cat >> "$gradle_user_home/gradle.properties" <<'PROPERTIES'
        org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
        kotlin.daemon.jvm.options=-Xmx2g
        org.gradle.workers.max=2
        PROPERTIES

    - name: Set up Android SDK command-line tools
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      with:
        packages: platform-tools

    - name: Install pinned Android SDK packages
      shell: bash
      env:
        COMPILE_SDK: ${{ steps.toolchain.outputs.compile_sdk }}
        BUILD_TOOLS: ${{ steps.toolchain.outputs.build_tools }}
        D8_BUILD_TOOLS: ${{ steps.toolchain.outputs.d8_build_tools }}
        NDK: ${{ steps.toolchain.outputs.ndk }}
        CMAKE: ${{ steps.toolchain.outputs.cmake }}
      run: |
        set -euo pipefail

        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        packages=(
          "platform-tools"
          "platforms;android-$COMPILE_SDK"
          "build-tools;$BUILD_TOOLS"
          "ndk;$NDK"
          "cmake;$CMAKE"
        )
        if [ "$D8_BUILD_TOOLS" != "$BUILD_TOOLS" ]; then
          packages+=("build-tools;$D8_BUILD_TOOLS")
        fi

        for attempt in 1 2 3; do
          if sdkmanager --install "${packages[@]}"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Android SDK package installation failed after $attempt attempts." >&2
            exit 1
          fi
          sleep $((attempt * 5))
        done

        echo "$ANDROID_SDK_ROOT/cmake/$CMAKE/bin" >> "$GITHUB_PATH"
