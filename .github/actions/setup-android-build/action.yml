name: Set up TrustAttestor Android toolchain
description: Install the versions pinned in android/gradle.properties.

outputs:
  compile-sdk:
    description: Android compile SDK
    value: ${{ steps.versions.outputs.compile_sdk }}
  build-tools:
    description: APK signing Build Tools
    value: ${{ steps.versions.outputs.build_tools }}
  d8-build-tools:
    description: D8/R8 Build Tools
    value: ${{ steps.versions.outputs.d8_build_tools }}
  ndk:
    description: Android NDK
    value: ${{ steps.versions.outputs.ndk }}
  cmake:
    description: CMake
    value: ${{ steps.versions.outputs.cmake }}

runs:
  using: composite
  steps:
    - name: Read pinned Android toolchain versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        from pathlib import Path

        props = {}
        for raw in Path("android/gradle.properties").read_text(encoding="utf-8").splitlines():
            line = raw.strip()
            if not line or line.startswith(("#", "!")) or "=" not in line:
                continue
            key, value = line.split("=", 1)
            props[key.strip()] = value.strip()

        names = {
            "compile_sdk": "trustAttestor.android.compileSdk",
            "build_tools": "trustAttestor.android.buildTools",
            "d8_build_tools": "trustAttestor.android.dexBuildTools",
            "ndk": "trustAttestor.android.ndk",
            "cmake": "trustAttestor.android.cmake",
        }
        for output, name in names.items():
            value = props.get(name)
            if not value:
                raise SystemExit(f"Missing required toolchain property: {name}")
            print(f"{output}={value}")
        PY

    - name: Set up Java 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools

    - name: Install pinned SDK, NDK and CMake
      shell: bash
      env:
        API: ${{ steps.versions.outputs.compile_sdk }}
        BUILD_TOOLS: ${{ steps.versions.outputs.build_tools }}
        D8_BUILD_TOOLS: ${{ steps.versions.outputs.d8_build_tools }}
        NDK: ${{ steps.versions.outputs.ndk }}
        CMAKE: ${{ steps.versions.outputs.cmake }}
      run: |
        set -euo pipefail
        packages=(
          "platforms;android-$API"
          "build-tools;$BUILD_TOOLS"
          "build-tools;$D8_BUILD_TOOLS"
          "ndk;$NDK"
          "cmake;$CMAKE"
        )
        for attempt in 1 2 3; do
          if sdkmanager --install "${packages[@]}"; then
            exit 0
          fi
          if ((attempt == 3)); then
            echo "SDK package installation failed after 3 attempts." >&2
            exit 1
          fi
          sleep $((attempt * 5))
        done

    # build-cli.sh uses an external Gradle home, not ~/.gradle.
    - name: Cache isolated Gradle dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/trustattestor-build/gradle-user
        key: ${{ runner.os }}-ta-gradle-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'android/**/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-ta-gradle-v1-
